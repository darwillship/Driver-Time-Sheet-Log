<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b2a46"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>Darwill Driver Log</title><style>
:root{--navy:#0b2a46;--blue:#1769aa;--green:#16834f;--red:#b42318;--amber:#a86b00;--bg:#eef3f7;--card:#fff;--text:#16202b;--muted:#617080;--line:#d7e0e8;--shadow:0 12px 34px rgba(9,38,62,.12)}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent}button,input,select,textarea{font:inherit}header{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,#071d31,var(--navy));color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 14px;box-shadow:0 3px 18px rgba(0,0,0,.2)}.head{max-width:780px;margin:auto;display:flex;justify-content:space-between;align-items:center}.brand{font-size:1.08rem;font-weight:900}.ver{font-size:.74rem;opacity:.8}main{max-width:780px;margin:auto;padding:14px 12px 120px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:17px;margin-bottom:14px}.hidden{display:none!important}h2{font-size:1.05rem;margin:0 0 14px;color:var(--navy)}label{display:block;font-weight:800;font-size:.9rem;margin-bottom:6px}input,select,textarea{width:100%;min-height:54px;border:1px solid #b9c6d2;border-radius:13px;padding:12px;background:#fff;font-size:16px;color:var(--text)}textarea{min-height:86px}.grid{display:grid;gap:12px}.two{grid-template-columns:1fr}.btn{border:0;border-radius:15px;min-height:58px;padding:13px 16px;font-weight:900;font-size:1rem;width:100%;cursor:pointer;transition:transform .08s ease,filter .15s ease;display:flex;align-items:center;justify-content:center;gap:8px}.btn:active{transform:scale(.975);filter:brightness(.94)}.primary{background:var(--navy);color:#fff}.success{background:var(--green);color:#fff}.danger{background:var(--red);color:#fff}.amber{background:var(--amber);color:#fff}.soft{background:#e8eef4;color:var(--navy)}.outline{background:#fff;color:var(--navy);border:2px solid var(--navy)}.actions{display:grid;gap:10px;margin-top:14px}.status{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#edf6ff;border-radius:15px;padding:13px}.driver{font-weight:900}.sub{font-size:.84rem;color:var(--muted);margin-top:3px}.dot{width:12px;height:12px;border-radius:50%;background:#21a466;box-shadow:0 0 0 6px rgba(33,164,102,.13)}.hero{text-align:center;padding:24px 12px 18px}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-weight:900;color:var(--muted);font-size:.75rem}.activity-name{font-size:2rem;font-weight:950;color:var(--navy);margin:8px 0}.timer{font-size:2.65rem;font-weight:950;letter-spacing:-.04em}.started{color:var(--muted);font-size:.9rem}.main-action{min-height:76px;font-size:1.25rem;border-radius:18px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.metric{background:#f6f9fb;border:1px solid var(--line);border-radius:13px;padding:10px;text-align:center}.metric b{display:block;font-size:1rem}.metric span{font-size:.7rem;color:var(--muted)}.step{display:flex;gap:8px;justify-content:center;margin-bottom:16px}.step i{display:block;width:38px;height:5px;border-radius:99px;background:#d7e0e8}.step i.on{background:var(--blue)}.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick .btn{min-height:64px}.location-list{display:grid;gap:8px;max-height:48vh;overflow:auto}.loc{border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px;text-align:left;cursor:pointer}.loc:active{background:#edf6ff}.loc b{display:block}.loc span{font-size:.82rem;color:var(--muted)}.recent{border:2px solid #90b8d9}.timeline-item{border-left:5px solid var(--blue);background:#fff;border-radius:14px;padding:12px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:9px}.timeline-item.active{border-left-color:var(--green);background:#f2fbf6}.row{display:flex;justify-content:space-between;gap:12px}.badge{font-size:.78rem;font-weight:900;background:#e8eef4;padding:5px 9px;border-radius:99px;white-space:nowrap}.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#132230;color:white;padding:12px 16px;border-radius:13px;font-weight:800;opacity:0;pointer-events:none;transition:.22s;z-index:100;max-width:90%;text-align:center}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.bottom{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.95);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));backdrop-filter:blur(14px)}.bottom-in{max-width:780px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}.small{min-height:50px}.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.summary{border:1px solid var(--line);border-radius:13px;padding:11px;background:#f8fafc}.summary span{font-size:.76rem;color:var(--muted)}.summary b{display:block;font-size:1.05rem}.notice{padding:12px;border-radius:12px;background:#fff5d9;color:#694700;font-weight:700;margin-bottom:12px}.error{background:#fff0ee;color:var(--red)}dialog{border:0;border-radius:20px;padding:0;width:min(94vw,650px);box-shadow:0 24px 70px rgba(0,0,0,.32)}dialog::backdrop{background:rgba(3,15,25,.62)}.dialog{padding:18px;max-height:90vh;overflow:auto}table{border-collapse:collapse;width:100%;font-size:.76rem}th,td{border:1px solid #bdc8d3;padding:6px;text-align:left;vertical-align:top}th{background:#e9eff4}@media(min-width:650px){.two{grid-template-columns:1fr 1fr}.quick{grid-template-columns:repeat(3,1fr)}.summary-grid{grid-template-columns:repeat(4,1fr)}}@media print{header,.bottom,.no-print,#startScreen,#activeScreen,#timelineCard,#historyCard{display:none!important}body{background:#fff}main{padding:0;max-width:none}.card{box-shadow:none;border:0}#reportCard{display:block!important}@page{margin:.4in}}
</style></head><body><header><div class="head"><div class="brand">Darwill Driver Log</div><div class="ver">Version 0.4</div></div></header><main><div id="toast" class="toast"></div>
<section id="resumeCard" class="card hidden"><h2>Resume Your Shift</h2><div id="resumeText" class="notice"></div><div class="actions two"><button class="btn primary" id="resumeBtn">Resume Shift</button><button class="btn danger" id="discardBtn">Discard</button></div></section>
<section id="startScreen" class="card"><h2>Start Shift</h2><div class="grid two"><div><label>Driver name</label><input id="driver" placeholder="Driver name" autocomplete="name"></div><div><label>Vehicle</label><select id="vehicle"><option value="">Select vehicle</option><option>McCook Van</option><option>McCook Hillside</option><option>Sterling 65</option><option>Sterling 66</option><option>International</option><option>Freightliner</option><option>Semi-Truck</option></select></div><div><label>Date</label><input id="date" type="date"></div><div><label>Start time</label><input id="startTime" type="time"></div></div><div class="actions"><button id="startBtn" class="btn success main-action">Start Shift</button></div></section>
<section id="activeScreen" class="hidden"><section class="card"><div class="status"><div><div class="driver" id="driverLine"></div><div class="sub" id="shiftLine"></div></div><div class="dot"></div></div><div class="hero"><div class="eyebrow">Current activity</div><div class="activity-name" id="currentName">Ready</div><div class="timer" id="timer">00:00</div><div class="started" id="startedLine"></div></div><div id="mainControls"></div><div class="metrics"><div class="metric"><b id="shiftMetric">0m</b><span>SHIFT</span></div><div class="metric"><b id="productiveMetric">0m</b><span>PRODUCTIVE</span></div><div class="metric"><b id="waitingMetric">0m</b><span>WAITING</span></div></div></section>
<section id="flowCard" class="card hidden"><div class="step"><i id="s1"></i><i id="s2"></i><i id="s3"></i></div><div id="flowContent"></div></section></section>
<section id="timelineCard" class="card hidden"><h2>Today’s Timeline</h2><div id="timeline"></div></section>
<section id="reportCard" class="card hidden"><div id="report"></div><div class="actions no-print"><button class="btn primary" onclick="print()">Print / Save PDF</button><button class="btn soft" id="csvDay">Export CSV</button><button class="btn soft" id="jsonDay">Export JSON</button><button class="btn outline" id="closeReport">Close</button></div></section>
<section id="historyCard" class="card"><h2>Saved History</h2><div id="history"></div><div class="actions"><button class="btn soft" id="csvAll">Export All CSV</button><button class="btn soft" id="jsonAll">Export All JSON</button></div></section></main>
<div id="bottom" class="bottom hidden"><div class="bottom-in"><button id="timelineBtn" class="btn soft small">Timeline</button><button id="endDayBtn" class="btn danger small">End Day</button></div></div>
<dialog id="endDialog"><div class="dialog"><h2>End Shift</h2><label>End time</label><input id="endTime" type="time"><div id="endError" class="notice error hidden"></div><div class="actions two"><button id="confirmEnd" class="btn danger">End Day</button><button id="cancelEnd" class="btn soft">Cancel</button></div></div></dialog>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),K={active:'dt04-active',history:'dt04-history',profile:'dt04-profile'};const vehicles=['McCook Van','McCook Hillside','Sterling 65','Sterling 66','International','Freightliner','Semi-Truck'];const places=[['ALG','1053 N Schmidt Rd, Romeoville, IL 60446'],['ENRU','1000 Windham Pkwy, Bolingbrook, IL 60490'],['Darwill Hillside','11900 Roosevelt Rd, Hillside, IL 60162'],['Darwill McCook','8701 47th St Ste C, McCook, IL 60525'],['South Suburban Post Office','6801 W 73rd St, Bedford Park, IL 60499'],['Fox Valley Post Office','3900 Gabrielle Ln, Aurora, IL 60598'],['Carol Stream Post Office','550 E Fullerton Ave, Carol Stream, IL 60188'],['Worth Post Office','11114 S Harlem Ave, Worth, IL 60482'],['Bolingbrook Post Office','105 Canterbury Ln, Bolingbrook, IL 60440'],['Darwill Oakbrook Tower Terrace','1 Tower Ln, Oakbrook Terrace, IL 60181'],['Envelopes Only','2000 S Park Ave, Streamwood, IL 60107'],['Federal Envelope','608 Country Club Dr, Bensenville, IL 60106'],['Universal Laminating','910 Carlow Dr Ste A, Bolingbrook, IL 60490'],['Platinum Converting','1560 W Stearns Rd, Bartlett, IL 60103'],['Victor Envelope','301 Arthur Ct, Bensenville, IL 60106'],['Supremex Naperville','1500 Shore Rd, Naperville, IL 60563'],['Supremex Chicago','4114 S Peoria St, Chicago, IL 60609']];const productive=new Set(['Driving','Loading','Unloading','Fueling','Warehouse work']);let day=null,stage=null,pending={},selected=null,tick=null;const read=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},write=(k,v)=>localStorage.setItem(k,JSON.stringify(v));const now=()=>new Date(),dateISO=()=>now().toISOString().slice(0,10),timeNow=()=>now().toTimeString().slice(0,5),mins=t=>{const[a,b]=t.split(':').map(Number);return a*60+b},dur=(a,b)=>{let x=mins(b)-mins(a);if(x<0)x+=1440;return x},fmt=m=>`${Math.floor(m/60)?Math.floor(m/60)+'h ':''}${Math.round(m%60)}m`,esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function toast(s){const t=$('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);navigator.vibrate?.(35)}function save(){write(K.active,day)}function current(){return day?.activities.find(a=>!a.end)}function elapsed(a){if(!a)return 0;return dur(a.start,timeNow())}function totals(d,live=true){let p=0,w=0,bl=0,drive=0;for(const a of d.activities){const m=a.end?dur(a.start,a.end):(live?elapsed(a):0);if(productive.has(a.type))p+=m;if(a.type==='Waiting')w+=m;if(['Break','Lunch'].includes(a.type))bl+=m;if(a.type==='Driving')drive+=m}const shift=dur(d.start,d.end||timeNow());return{p,w,bl,drive,shift,np:Math.max(0,shift-p),pct:shift?p/shift*100:0}}function render(){const active=!!day;$('startScreen').classList.toggle('hidden',active);$('activeScreen').classList.toggle('hidden',!active);$('timelineCard').classList.toggle('hidden',!active);$('bottom').classList.toggle('hidden',!active);if(!active){renderHistory();return}$('driverLine').textContent=`${day.driver} • ${day.vehicle}`;$('shiftLine').textContent=`Started ${day.start} • ${day.date}`;renderCurrent();renderTimeline()}function renderCurrent(){const c=current(),t=totals(day);$('shiftMetric').textContent=fmt(t.shift);$('productiveMetric').textContent=fmt(t.p);$('waitingMetric').textContent=fmt(t.w);if(c){$('currentName').textContent=c.type;$('timer').textContent=fmt(elapsed(c)).replace(' ','');$('startedLine').textContent=`Started ${c.start}${c.location?' • '+c.location:''}`}else{$('currentName').textContent='Ready';$('timer').textContent='00:00';$('startedLine').textContent='Choose your next action'}const mc=$('mainControls');if(stage){mc.innerHTML='';$('flowCard').classList.remove('hidden');renderFlow();return}$('flowCard').classList.add('hidden');if(!c)mc.innerHTML=`<button class="btn primary main-action" id="startDriving">Start Driving</button><div class="actions"><button class="btn soft" id="otherActivity">Start Other Activity</button></div>`;else if(c.type==='Driving')mc.innerHTML=`<button class="btn success main-action" id="arrived">Arrived</button>`;else mc.innerHTML=`<button class="btn primary main-action" id="depart">Depart</button><div class="actions"><button class="btn soft" id="finishActivity">Finish Activity</button></div>`;$('startDriving')?.addEventListener('click',()=>startActivity('Driving'));$('otherActivity')?.addEventListener('click',()=>{stage='activity';pending={};renderCurrent()});$('arrived')?.addEventListener('click',()=>{endCurrent();stage='location';pending={arrival:timeNow()};renderCurrent()});$('depart')?.addEventListener('click',()=>{endCurrent();startActivity('Driving');toast('Driving started')});$('finishActivity')?.addEventListener('click',()=>{endCurrent();toast('Activity finished')})}function renderFlow(){['s1','s2','s3'].forEach((x,i)=>$(x).classList.toggle('on',i<=(stage==='location'?0:stage==='activity'?1:2)));const f=$('flowContent');if(stage==='location'){const recent=read('dt04-recent',[]);const ordered=[...recent.map(n=>places.find(p=>p[0]===n)).filter(Boolean),...places.filter(p=>!recent.includes(p[0]))];f.innerHTML=`<h2>Select Location</h2><div class="location-list">${ordered.map((p,i)=>`<button class="loc ${i<recent.length?'recent':''}" data-place="${esc(p[0])}"><b>${esc(p[0])}</b><span>${esc(p[1])}</span></button>`).join('')}<button class="loc" data-place="Other"><b>Other Location</b><span>Enter a custom location</span></button></div><div class="actions"><button class="btn soft" id="cancelFlow">Cancel</button></div>`;f.querySelectorAll('[data-place]').forEach(b=>b.onclick=()=>selectPlace(b.dataset.place));$('cancelFlow').onclick=()=>{stage=null;pending={};renderCurrent()}}else if(stage==='activity'){f.innerHTML=`<h2>What are you doing?</h2><div class="quick">${['Loading','Unloading','Waiting','Fueling','Break','Lunch','Warehouse work','Vehicle issue','Other'].map(a=>`<button class="btn ${a==='Waiting'?'amber':a==='Vehicle issue'?'danger':'soft'}" data-act="${a}">${a}</button>`).join('')}</div><div class="actions"><button class="btn soft" id="backFlow">Back</button></div>`;f.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{pending.type=b.dataset.act;stage='confirm';renderCurrent()});$('backFlow').onclick=()=>{stage=pending.location?'location':null;renderCurrent()}}else{f.innerHTML=`<h2>Confirm Stop</h2><div class="notice"><b>${esc(pending.type)}</b><br>${esc(pending.location||'No location')}<br>${esc(pending.address||'')}</div><label>Notes (optional)</label><textarea id="notes" placeholder="Add a short note only if needed"></textarea><div class="actions"><button class="btn success main-action" id="beginStop">Start ${esc(pending.type)}</button><button class="btn soft" id="backAct">Back</button></div>`;$('beginStop').onclick=()=>{startActivity(pending.type,pending.location,pending.address,$('notes').value);stage=null;pending={};toast('Activity started')};$('backAct').onclick=()=>{stage='activity';renderCurrent()}}}function selectPlace(name){if(name==='Other'){const n=prompt('Enter location or customer name:');if(!n)return;const a=prompt('Enter address (optional):')||'';pending.location=n;pending.address=a}else{const p=places.find(x=>x[0]===name);pending.location=p[0];pending.address=p[1];const r=read('dt04-recent',[]).filter(x=>x!==name);write('dt04-recent',[name,...r].slice(0,3))}stage='activity';renderCurrent()}function startActivity(type,location='',address='',notes=''){if(current())endCurrent();day.activities.push({id:crypto.randomUUID?.()||Date.now().toString(),type,start:timeNow(),end:'',location,address,notes});save();stage=null;render();toast(`${type} started`)}function endCurrent(){const c=current();if(c){c.end=timeNow();save();render()}}function renderTimeline(){const list=[...day.activities].reverse();$('timeline').innerHTML=list.length?list.map(a=>`<div class="timeline-item ${!a.end?'active':''}"><div class="row"><div><b>${esc(a.type)}</b><div class="sub">${esc(a.start)}–${esc(a.end||'Now')}${a.location?' • '+esc(a.location):''}</div>${a.address?`<div class="sub">${esc(a.address)}</div>`:''}</div><span class="badge">${fmt(a.end?dur(a.start,a.end):elapsed(a))}</span></div></div>`).join(''):'<div class="sub">No activities recorded yet.</div>'}function startDay(){const driver=$('driver').value.trim(),vehicle=$('vehicle').value,date=$('date').value,start=$('startTime').value;if(!driver||!vehicle||!date||!start)return toast('Complete all shift fields');day={id:crypto.randomUUID?.()||Date.now().toString(),driver,vehicle,date,start,end:'',activities:[],completedAt:''};write(K.profile,{driver,vehicle});save();render();startActivity('Driving')}function finishDay(){if(current())endCurrent();const end=$('endTime').value;if(!end||dur(day.start,end)<=0){$('endError').textContent='End time must be after the shift start.';$('endError').classList.remove('hidden');return}day.end=end;day.completedAt=new Date().toISOString();day.totals=totals(day,false);const h=read(K.history,[]);h.unshift(day);write(K.history,h);selected=day;localStorage.removeItem(K.active);day=null;$('endDialog').close();render();showReport(selected);toast('Day saved')}function showReport(d){selected=d;const t=d.totals||totals(d,false),rows=d.activities.map((a,i)=>`<tr><td>${i+1}</td><td>${esc(a.start)}</td><td>${esc(a.end)}</td><td>${fmt(dur(a.start,a.end))}</td><td>${esc(a.type)}</td><td>${esc(a.location)}</td><td>${esc(a.address)}</td><td>${esc(a.notes)}</td></tr>`).join('');$('report').innerHTML=`<div style="text-align:center;margin-bottom:16px"><h1 style="margin:0;color:var(--navy)">Daily Driver Time Sheet</h1><div class="sub">${esc(d.driver)} • ${esc(d.date)} • ${esc(d.vehicle)}</div><div class="sub">${esc(d.start)}–${esc(d.end)}</div></div><div style="overflow:auto"><table><thead><tr><th>#</th><th>Start</th><th>End</th><th>Time</th><th>Activity</th><th>Location</th><th>Address</th><th>Notes</th></tr></thead><tbody>${rows}</tbody></table></div><div class="summary-grid" style="margin-top:14px"><div class="summary"><span>SHIFT</span><b>${fmt(t.shift)}</b></div><div class="summary"><span>DRIVING</span><b>${fmt(t.drive)}</b></div><div class="summary"><span>PRODUCTIVE</span><b>${fmt(t.p)}</b></div><div class="summary"><span>WAITING</span><b>${fmt(t.w)}</b></div><div class="summary"><span>BREAK/LUNCH</span><b>${fmt(t.bl)}</b></div><div class="summary"><span>NONPRODUCTIVE</span><b>${fmt(t.np)}</b></div><div class="summary"><span>PRODUCTIVITY</span><b>${t.pct.toFixed(1)}%</b></div></div>`;$('reportCard').classList.remove('hidden');$('reportCard').scrollIntoView({behavior:'smooth'})}function rowsFor(d){const t=d.totals||totals(d,false);return d.activities.map((a,i)=>({Driver:d.driver,Date:d.date,Vehicle:d.vehicle,ShiftStart:d.start,ShiftEnd:d.end,Activity:i+1,Start:a.start,End:a.end,Minutes:dur(a.start,a.end),Type:a.type,Location:a.location,Address:a.address,Notes:a.notes,ShiftMinutes:t.shift,ProductiveMinutes:t.p,WaitingMinutes:t.w,ProductivityPercent:t.pct.toFixed(1)}))}function dl(name,text,type){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([text],{type}));a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}function csv(ds,name){const rows=ds.flatMap(rowsFor);if(!rows.length)return toast('No records to export');const h=Object.keys(rows[0]),q=v=>`"${String(v??'').replaceAll('"','""')}"`;dl(name,[h.map(q).join(','),...rows.map(r=>h.map(k=>q(r[k])).join(','))].join('\n'),'text/csv')}function json(ds,name){if(!ds.length)return toast('No records to export');dl(name,JSON.stringify(ds,null,2),'application/json')}function renderHistory(){const h=read(K.history,[]);$('history').innerHTML=h.length?h.map(d=>`<div class="timeline-item"><div class="row"><div><b>${esc(d.driver)} — ${esc(d.date)}</b><div class="sub">${esc(d.vehicle)} • ${fmt((d.totals||totals(d,false)).shift)}</div></div><button class="btn soft small" style="width:auto" data-view="${d.id}">View</button></div></div>`).join(''):'<div class="sub">No completed days yet.</div>';$('history').querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{const d=h.find(x=>x.id===b.dataset.view);if(d)showReport(d)})}function init(){const p=read(K.profile,{});$('driver').value=p.driver||'';$('vehicle').value=p.vehicle||'';$('date').value=dateISO();$('startTime').value=timeNow();$('startBtn').onclick=startDay;$('endDayBtn').onclick=()=>{$('endTime').value=timeNow();$('endError').classList.add('hidden');$('endDialog').showModal()};$('confirmEnd').onclick=finishDay;$('cancelEnd').onclick=()=>$('endDialog').close();$('timelineBtn').onclick=()=>$('timelineCard').scrollIntoView({behavior:'smooth'});$('closeReport').onclick=()=>$('reportCard').classList.add('hidden');$('csvDay').onclick=()=>selected&&csv([selected],`${selected.driver}-${selected.date}.csv`);$('jsonDay').onclick=()=>selected&&json([selected],`${selected.driver}-${selected.date}.json`);$('csvAll').onclick=()=>csv(read(K.history,[]),'driver-timesheet-history.csv');$('jsonAll').onclick=()=>json(read(K.history,[]),'driver-timesheet-history.json');const a=read(K.active,null);if(a){$('resumeCard').classList.remove('hidden');$('startScreen').classList.add('hidden');$('resumeText').textContent=`${a.driver} has an unfinished shift from ${a.date}.`;$('resumeBtn').onclick=()=>{day=a;$('resumeCard').classList.add('hidden');render()};$('discardBtn').onclick=()=>{if(confirm('Discard this unfinished shift?')){localStorage.removeItem(K.active);$('resumeCard').classList.add('hidden');$('startScreen').classList.remove('hidden')}}}renderHistory();tick=setInterval(()=>{if(day){renderCurrent();renderTimeline()}},1000);if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}init()})();
</script></body></html>
